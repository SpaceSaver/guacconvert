name: Convert Guacamole Recording to Video

on:
  push:
    paths:
      - '**.guac'
  workflow_dispatch:
    inputs:
      guac_file_path:
        description: 'Relative path to the .guac file (optional if triggered manually)'
        required: false
        default: ''

jobs:
  convert-guac:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libtool-bin \
            libossp-uuid-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            ffmpeg

      - name: Build guacenc from source
        run: |
          GUAC_VERSION="1.5.5"
          wget https://downloads.apache.org/guacamole/${GUAC_VERSION}/source/guacamole-server-${GUAC_VERSION}.tar.gz
          tar -xzf guacamole-server-${GUAC_VERSION}.tar.gz
          cd guacamole-server-${GUAC_VERSION}
          ./configure --with-init-dir=/etc/init.d
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Locate .guac file
        id: find_files
        run: |
          if [ -n "${{ github.event.inputs.guac_file_path }}" ]; then
            echo "FILE_PATH=${{ github.event.inputs.guac_file_path }}" >> $GITHUB_ENV
          else
            FILE=$(find . -maxdepth 3 -name "*.guac" | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Error: No .guac file found."
              exit 1
            fi
            echo "FILE_PATH=$FILE" >> $GITHUB_ENV
          fi

      - name: Detect Resolution & Convert to High-Clarity MP4
        run: |
          FILE="${{ env.FILE_PATH }}"
          echo "Processing $FILE..."

          # Extract size instruction line by splitting at semicolons first
          SIZE_LINE=$(tr ';' '\n' < "$FILE" | grep -m 1 '\.size,' || true)

          if [ -n "$SIZE_LINE" ]; then
            RAW_W=$(echo "$SIZE_LINE" | awk -F',' '{print $3}')
            RAW_H=$(echo "$SIZE_LINE" | awk -F',' '{print $4}')

            WIDTH=$(echo "$RAW_W" | sed 's/.*\.//' | tr -d '[:alpha:];')
            HEIGHT=$(echo "$RAW_H" | sed 's/.*\.//' | tr -d '[:alpha:];')
          fi

          # Safe fallback if parsing fails
          WIDTH=${WIDTH:-640}
          HEIGHT=${HEIGHT:-480}

          # 2x Integer Upscale to preserve text crispness (e.g. 640x480 -> 1280x960)
          U_WIDTH=$((WIDTH * 2))
          U_HEIGHT=$((HEIGHT * 2))
          RESOLUTION="${U_WIDTH}x${U_HEIGHT}"

          echo "Original: ${WIDTH}x${HEIGHT} | Upscaled Target: $RESOLUTION"

          # Encode at 2x canvas size with high bitrate
          guacenc -s "$RESOLUTION" -r 15000000 "$FILE"

          M4V_FILE="${FILE}.m4v"
          OUTPUT_MP4="${FILE}.mp4"

          if [ -f "$M4V_FILE" ]; then
            # Convert to MP4 using CRF 14 (visually lossless) & crisp nearest-neighbor scaling
            ffmpeg -i "$M4V_FILE" \
              -vf "scale=iw:ih:flags=neighbor" \
              -c:v libx264 -crf 14 -preset slow -pix_fmt yuv420p "$OUTPUT_MP4"
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-video-recording
          path: |
            **/*.mp4
          retention-days: 7
