name: Convert Guacamole Recording to Video

on:
  push:
    paths:
      - '**.guac'
  workflow_dispatch:
    inputs:
      guac_file_path:
        description: 'Relative path to the .guac file (optional if triggered manually)'
        required: false
        default: ''

jobs:
  convert-guac:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libtool-bin \
            libossp-uuid-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            ffmpeg

      - name: Build guacenc from source
        run: |
          GUAC_VERSION="1.5.5"
          wget https://downloads.apache.org/guacamole/${GUAC_VERSION}/source/guacamole-server-${GUAC_VERSION}.tar.gz
          tar -xzf guacamole-server-${GUAC_VERSION}.tar.gz
          cd guacamole-server-${GUAC_VERSION}
          ./configure --with-init-dir=/etc/init.d
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Locate .guac file
        id: find_files
        run: |
          if [ -n "${{ github.event.inputs.guac_file_path }}" ]; then
            echo "FILE_PATH=${{ github.event.inputs.guac_file_path }}" >> $GITHUB_ENV
          else
            FILE=$(find . -maxdepth 3 -name "*.guac" | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Error: No .guac file found."
              exit 1
            fi
            echo "FILE_PATH=$FILE" >> $GITHUB_ENV
          fi

      - name: Extract Real Resolution & Convert to MP4
        run: |
          FILE="${{ env.FILE_PATH }}"
          echo "Analyzing $FILE for real display dimensions..."

          # Extract max layer 0 resolution from .size commands
          REAL_DIM=$(tr ';' '\n' < "$FILE" | grep '\.size,1\.0,' | awk -F',' '{
            gsub(/.*[\.]/, "", $3); 
            gsub(/.*[\.]/, "", $4); 
            w=$3; h=$4; 
            if (w > max_w) max_w=w; 
            if (h > max_h) max_h=h; 
          } END { 
            if (max_w > 0 && max_h > 0) print max_w " " max_h; 
          }')

          READ_W=$(echo $REAL_DIM | awk '{print $1}')
          READ_H=$(echo $REAL_DIM | awk '{print $2}')

          # Fallback if layer 0 size parsing is missing
          WIDTH=${READ_W:-1473}
          HEIGHT=${READ_H:-834}

          # 2x Integer scaling to guarantee razor-sharp text
          TARGET_W=$((WIDTH * 2))
          TARGET_H=$((HEIGHT * 2))
          RESOLUTION="${TARGET_W}x${TARGET_H}"

          echo "True Native Base: ${WIDTH}x${HEIGHT} | Target Render Resolution: $RESOLUTION"

          # Encode canvas at 2x native size
          guacenc -s "$RESOLUTION" -r 15000000 "$FILE"

          M4V_FILE="${FILE}.m4v"
          OUTPUT_MP4="${FILE}.mp4"

          if [ -f "$M4V_FILE" ]; then
            # Convert using visually lossless encoding (CRF 14) and crisp edge preservation
            ffmpeg -i "$M4V_FILE" \
              -vf "scale=iw:ih:flags=neighbor" \
              -c:v libx264 -crf 14 -preset slow -pix_fmt yuv420p "$OUTPUT_MP4"
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-video-recording
          path: |
            **/*.mp4
          retention-days: 7
