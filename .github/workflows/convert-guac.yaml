name: Convert Guacamole Recording to Video

on:
  push:
    paths:
      - '**.guac'
  workflow_dispatch:
    inputs:
      guac_file_path:
        description: 'Relative path to the .guac file (optional if triggered manually)'
        required: false
        default: ''

jobs:
  convert-guac:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install guacenc dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y guacamole-server-utils ffmpeg

      - name: Locate .guac files
        id: find_files
        run: |
          if [ -n "${{ github.event.inputs.guac_file_path }}" ]; then
            echo "FILE_PATH=${{ github.event.inputs.guac_file_path }}" >> $GITHUB_ENV
          else
            # Find the first .guac file in the repo
            FILE=$(find . -maxdepth 3 -name "*.guac" | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Error: No .guac file found."
              exit 1
            fi
            echo "FILE_PATH=$FILE" >> $GITHUB_ENV
          fi

      - name: Convert .guac to video
        run: |
          echo "Converting ${{ env.FILE_PATH }}..."
          
          # guacenc converts the file and outputs an .m4v video in the same directory
          guacenc "${{ env.FILE_PATH }}"

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-video-recording
          path: |
            **/*.m4v
            **/*.mp4
          retention-days: 7
