name: Convert Guacamole Recording to Video

on:
  push:
    paths:
      - '**.guac'
  workflow_dispatch:
    inputs:
      guac_file_path:
        description: 'Relative path to the .guac file (optional if triggered manually)'
        required: false
        default: ''

jobs:
  convert-guac:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libcairo2-dev \
            libjpeg-turbo8-dev \
            libpng-dev \
            libtool-bin \
            libossp-uuid-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            ffmpeg

      - name: Build guacenc from source
        run: |
          GUAC_VERSION="1.5.5"
          wget https://downloads.apache.org/guacamole/${GUAC_VERSION}/source/guacamole-server-${GUAC_VERSION}.tar.gz
          tar -xzf guacamole-server-${GUAC_VERSION}.tar.gz
          cd guacamole-server-${GUAC_VERSION}
          ./configure --with-init-dir=/etc/init.d
          make -j$(nproc)
          sudo make install
          sudo ldconfig

      - name: Locate .guac file
        id: find_files
        run: |
          if [ -n "${{ github.event.inputs.guac_file_path }}" ]; then
            echo "FILE_PATH=${{ github.event.inputs.guac_file_path }}" >> $GITHUB_ENV
          else
            FILE=$(find . -maxdepth 3 -name "*.guac" | head -n 1)
            if [ -z "$FILE" ]; then
              echo "Error: No .guac file found."
              exit 1
            fi
            echo "FILE_PATH=$FILE" >> $GITHUB_ENV
          fi

      - name: Detect Native Resolution & Convert to MP4
        run: |
          FILE="${{ env.FILE_PATH }}"
          echo "Processing $FILE..."

          # Split semicolon-delimited instructions onto separate lines and grab .size
          SIZE_LINE=$(tr ';' '\n' < "$FILE" | grep -m 1 '\.size,' || true)

          if [ -n "$SIZE_LINE" ]; then
            RAW_W=$(echo "$SIZE_LINE" | awk -F',' '{print $3}')
            RAW_H=$(echo "$SIZE_LINE" | awk -F',' '{print $4}')

            WIDTH=$(echo "$RAW_W" | sed 's/.*\.//' | tr -d '[:alpha:];')
            HEIGHT=$(echo "$RAW_H" | sed 's/.*\.//' | tr -d '[:alpha:];')

            if [ -n "$WIDTH" ] && [ -n "$HEIGHT" ]; then
              RESOLUTION="${WIDTH}x${HEIGHT}"
            fi
          fi

          if [ -z "$RESOLUTION" ]; then
            echo "Could not extract size instruction. Falling back to 1920x1080."
            RESOLUTION="1920x1080"
          fi

          echo "Detected native resolution: $RESOLUTION"

          # Encode using native resolution
          guacenc -s "$RESOLUTION" -r 10000000 "$FILE"

          M4V_FILE="${FILE}.m4v"
          OUTPUT_MP4="${FILE}.mp4"

          if [ -f "$M4V_FILE" ]; then
            ffmpeg -i "$M4V_FILE" -c:v libx264 -crf 18 -preset slow -pix_fmt yuv420p "$OUTPUT_MP4"
          fi

      - name: Upload Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: converted-video-recording
          path: |
            **/*.mp4
          retention-days: 7
